# Checks the docs against the code and builds the docs site (mkdocs.yml) on every push and pull request;
# pushes to main also publish it to GitHub Pages: https://shmarlya.github.io/trialwatch/
# Needs Settings → Pages → Source = "GitHub Actions". Diagram images are not rendered here: they are
# committed (tools/diagrams/render.mjs, pre-commit hook) and tests/test_docs.py fails if one is stale.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Check docs against code, and images against diagrams
        run: uv run --locked --group docs pytest -q tests/test_docs.py

      - name: Build site
        run: uv run --locked --group docs mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; a newer push waits instead of cancelling one mid-way.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
