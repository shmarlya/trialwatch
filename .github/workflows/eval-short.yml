# Short gold evaluation: our workflow on the 50 hardest items of the Bruckner gold dataset
# (evals/hard-50.txt, from `trialwatch gold sample`), run 3 times on the same evidence and gated by
# evals/gates/short.json: against its accepted baseline (evals/baselines/gold-short.json), with no clear
# false accusation and no item that is "not full" in one run and "full" in another. Started by hand from
# the Actions tab; it calls the model, so it costs API money.
name: Gold evaluation · short (hardest 50)

on:
  workflow_dispatch:
    inputs:
      config:
        description: "The check's setup (a file in src/trialwatch/checks/configs/, without .json)"
        default: default

permissions:
  contents: read

jobs:
  evaluate:
    uses: ./.github/workflows/eval-shared.yml
    with:
      title: "Gold evaluation · hardest 50 of bruckner/2026-03-16"
      sample: evals/hard-50.txt
      config: ${{ inputs.config }}
      gates: evals/gates/short.json
      repeat: 3
      timeout: 120
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
