# Builds the TrialWatch images and pushes them to GitHub's registry: the app, ghcr.io/shmarlya/trialwatch, and the
# helpers a deploy needs (ops/images/Dockerfile): trialwatch-migrate, -proxy, -grafana, -dbtools. Started by hand
# (Actions → Image → Run workflow, or `gh workflow run image.yml --ref main`). The tests run first; a red commit
# gets no image. Every run tags its image sha-<commit>; a run from main also moves `latest` to it, so `latest`
# is always the newest deployment. A server runs it with `docker compose pull` (docs/operations.md).
name: Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Extra tag, e.g. v1.2.0 (optional)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  image:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - suffix: ""
            file: Dockerfile
            target: ""
          - suffix: -migrate
            file: ops/images/Dockerfile
            target: migrate
          - suffix: -proxy
            file: ops/images/Dockerfile
            target: proxy
          - suffix: -grafana
            file: ops/images/Dockerfile
            target: grafana
          - suffix: -dbtools
            file: ops/images/Dockerfile
            target: dbtools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          flavor: latest=false
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=image${{ matrix.suffix }}
