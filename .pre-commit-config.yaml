# Git hooks run by pre-commit (a uv dev dependency). One-time setup: uv run pre-commit install
# Ruff comes from uv.lock, the same version CI runs. --force-exclude: pre-commit names the files, and ruff
# must still skip the ones pyproject.toml leaves out.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run --locked ruff check --fix --force-exclude
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run --locked ruff format --force-exclude
        types_or: [python, pyi]
        require_serial: true
