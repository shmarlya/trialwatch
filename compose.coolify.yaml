# TrialWatch on Coolify: the database, the web interface and the worker, nothing else. Coolify already does
# the rest: its proxy holds the certificate and sends plain HTTP to web, it shows each container's memory
# and CPU, and it backs the database up (the db service's Backups tab, to S3). Every service runs a
# published image, so nothing of the repository is needed on the server, and each has a memory and CPU
# limit, so none can take the server down with it. compose.yaml is the larger stack for a server of our
# own (Caddy, Grafana, backups to a volume), built from the checkout.
#
# Paste it as a Docker Compose resource; give the `web` service the domain with its port
# (https://trialwatch.app:8010). Set the variables below in Coolify's Environment Variables (`:?` marks
# the required ones). docs/operations.md ("Coolify") says how. The image comes from
# .github/workflows/image.yml: run it on main first.

# What web and worker share: the app's image, its limits, the database and the settings. Each applies
# the migrations baked into the image before it starts (`dbmate --wait up`; a lock makes the second wait
# for the first, then find nothing to do).
x-trialwatch: &trialwatch
  image: ghcr.io/shmarlya/trialwatch:${TRIALWATCH_TAG:-latest}
  entrypoint: ["/bin/sh", "-c", "dbmate --wait up && exec trialwatch \"$$@\"", "--"]
  restart: unless-stopped
  mem_limit: 512m
  cpus: 1.0
  environment: &trialwatch-environment
    # sslmode=disable: the database is on the stack's own network (dbmate asks for TLS otherwise)
    DATABASE_URL: postgresql://${POSTGRES_USER:-trialwatch}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-trialwatch}?sslmode=disable
    TZ: UTC
    # For checks and AI tags; empty = no model calls
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  depends_on:
    db:
      condition: service_healthy

services:
  # The web interface (`trialwatch web`) on port 8010, reached through Coolify's proxy
  web:
    <<: *trialwatch
    command: ["web", "--host", "0.0.0.0", "--no-worker"]
    environment:
      <<: *trialwatch-environment
      # The site's public name: requests for any other name are refused (DNS rebinding)
      TRIALWATCH_HOSTS: ${TRIALWATCH_DOMAIN:?}
      # Only Coolify's proxy reaches this service, so its X-Forwarded-* headers are trusted
      # (the client's address for the sign-in throttle, https for the session cookie)
      FORWARDED_ALLOW_IPS: "*"
      # The first admin, added at start if no user has this email (ADR-006)
      TRIALWATCH_ADMIN_EMAIL: ${TRIALWATCH_ADMIN_EMAIL:-}
      TRIALWATCH_ADMIN_PASSWORD: ${TRIALWATCH_ADMIN_PASSWORD:-}
    healthcheck:
      # /healthz answers (the image's own check, with time for the migrations first)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Runs queued jobs (web forms, the weekly refresh) one at a time and tries failed ones again
  worker:
    <<: *trialwatch
    command: ["worker"]
    # a job downloads documents of up to 300 MB, and a child process reads each PDF's text, which
    # takes about ten times the file's size (a 47 MB report: 550 MB); one that runs out fails only
    # its file (src/trialwatch/trials/pages.py)
    mem_limit: 2g
    # two PDFs read at once, a child process each (TRIALWATCH_PDF_READERS, default 2), within a memory
    # budget for the children together (TRIALWATCH_PDF_MEMORY_MB, default 1400). Two CPUs: the server
    # needs at least two (on one, set cpus: 1.0 and TRIALWATCH_PDF_READERS=1). The web server reads
    # uploads one at a time whatever these say.
    cpus: 2.0
    environment:
      <<: *trialwatch-environment
      TRIALWATCH_PDF_READERS: ${TRIALWATCH_PDF_READERS:-2}
      TRIALWATCH_PDF_MEMORY_MB: ${TRIALWATCH_PDF_MEMORY_MB:-1400}
    healthcheck:
      # touched every loop and every 30 s while a job runs: older than 2 minutes means stuck
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/trialwatch-worker.alive') > 120)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trialwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-trialwatch}
      TZ: UTC
    volumes:
      # Postgres 18+ keeps data under /var/lib/postgresql/<major>/, so mount the parent
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
