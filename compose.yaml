services:
  app:
    build: .
    image: trialwatch:dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: UTC
    volumes:
      # Research files, read-only, for `ctis seed`: data/bruckner/ is in git, the rest is local only
      - ./data:/app/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Applies db/migrations/*.sql and writes db/schema.sql, then exits; the app starts only if this
  # succeeds. Takes dbmate's arguments (`docker compose run --rm migrate rollback`). schema.sql
  # leaves out dev_schema_migrations, which exists only where migrate-dev ran.
  migrate:
    image: ghcr.io/amacneil/dbmate:2.37.0
    entrypoint: ["/bin/sh", "-c", "dbmate --no-dump-schema \"$$@\" && dbmate dump -- --exclude-table=public.dev_schema_migrations", "dbmate"]
    command: ["--wait", "up"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      DBMATE_MIGRATION_LOCK: "true"
    volumes:
      - ./db:/db
    depends_on:
      db:
        condition: service_healthy

  # Optional, development and tests only: applies db/dev/*.sql (Bruckner et al.'s data) after
  # migrate, recorded in its own table so production bookkeeping never sees it. db/dev/ is
  # generated from data/bruckner/, not committed; build it with `uv run python scripts/dev_seed.py`.
  # Profile dev keeps it out of `up`; start it with `docker compose run --rm migrate-dev`. Settings
  # are env vars, not flags, so `run --rm migrate-dev rollback` / `status` also act on db/dev only.
  migrate-dev:
    image: ghcr.io/amacneil/dbmate:2.37.0
    profiles: [dev]
    command: ["--wait", "up"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      DBMATE_MIGRATION_LOCK: "true"
      DBMATE_MIGRATIONS_DIR: /db/dev
      DBMATE_MIGRATIONS_TABLE: dev_schema_migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db:/db
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    ports:
      # Localhost only: reachable from this machine (or via SSH tunnel on a server), never from outside
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ keeps data under /var/lib/postgresql/<major>/, so mount the parent
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
