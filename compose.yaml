services:
  app:
    build: .
    image: trialwatch:dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: UTC
      # For `check evidence`: put ANTHROPIC_API_KEY=... in .env (git-ignored); empty = no model calls
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The gold datasets in the mounted data/ (the package's own path is inside the image's venv).
      # They are read here; `gold build` runs on the host, where data/gold/ is writable.
      TRIALWATCH_GOLD_DIR: /app/data/gold
    volumes:
      # Research files and gold datasets, read-only: data/bruckner/ and data/gold/ are in git
      - ./data:/app/data:ro
      # Writable, git-ignored: `source transfer ctis --files-dir data/ctis/documents` writes copies of the PDFs there
      - ./data/ctis:/app/data/ctis
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Applies db/migrations/*.sql and writes db/schema.sql, then exits; the app starts only if this
  # succeeds. Takes dbmate's arguments (`docker compose run --rm migrate status`).
  migrate:
    image: ghcr.io/amacneil/dbmate:2.37.0
    command: ["--wait", "up"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      DBMATE_MIGRATION_LOCK: "true"
    volumes:
      - ./db:/db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    ports:
      # Localhost only: reachable from this machine (or via SSH tunnel on a server), never from outside
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ keeps data under /var/lib/postgresql/<major>/, so mount the parent
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
