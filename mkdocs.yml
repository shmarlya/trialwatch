# Docs site: uv run --group docs mkdocs serve  (strict build: mkdocs build --strict)
# All pages are generated by tools/site_hooks.py: Home from README.md, Glossary from GLOSSARY.md and one
# page per docs/**/*.excalidraw diagram (its image from docs/img/ plus its text, so search finds it).
site_name: TrialWatch
site_description: AI watchdog tracking missing and incomplete clinical-trial results in the EU register
site_url: https://shmarlya.github.io/trialwatch/
repo_url: https://github.com/shmarlya/trialwatch
repo_name: shmarlya/trialwatch
docs_dir: docs
hooks:
  - tools/site_hooks.py
watch:
  - README.md
  - GLOSSARY.md
  - data/bruckner/README.md
  - tools/site_hooks.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search:
      # Material's recommended word separator: diagram text like "(MockTransport)" or "ctis/store.py"
      # must split into words, not stay one token with its brackets and slashes.
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

# Every diagram needs a nav entry here (tests/test_docs.py checks); --strict turns these warnings into errors.
nav:
  - Home: index.md
  - Architecture:
      - Current system (as built): system-design.md
      - High-level architecture: architecture.md
      - Database tables: db.md
      - External API interfaces: external-apis.md
  - Decisions:
      - AI architecture decisions: ai-architecture-decisions.md
      - ADR roadmap: adr-roadmap.md
      - "ADR-001: Success criteria": adr/ADR-001-success-criteria.md
  - Benchmark data: data/bruckner/README.md
  - Glossary: glossary.md
not_in_nav: |
  /adr/ADR-template.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
