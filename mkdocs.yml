# Docs site: uv run --group docs mkdocs serve  (strict build: mkdocs build --strict)
# The pages are the markdown in docs/; tools/site_hooks.py adds README.md (Home), STYLE.md and the benchmark
# data's README, and sends links to the decisions (docs/adr/, kept in the repo only) to GitHub.
# Diagrams are Mermaid code blocks (pymdownx.superfences below), drawn in the browser by Material.
site_name: TrialWatch
site_description: AI watchdog tracking missing and incomplete clinical-trial results in the EU register
site_url: https://shmarlya.github.io/trialwatch/
repo_url: https://github.com/shmarlya/trialwatch
repo_name: shmarlya/trialwatch
docs_dir: docs
# The decisions stay in the repo only, not on the site
exclude_docs: |
  adr/
hooks:
  - tools/site_hooks.py
watch:
  - README.md
  - STYLE.md
  - data/bruckner/README.md
  - tools/site_hooks.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search:
      # Material's recommended word separator: names like "(CtisClient.search)" or "sources/stages.py" must
      # split into words, not stay one token with their brackets and slashes.
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

# Every page needs a nav entry here; --strict turns these warnings into errors.
nav:
  - Home: index.md
  - Patient search: search.md
  - Checks: checks.md
  - Sources and gold: sources-and-gold.md
  - Operations: operations.md
  - Benchmark data: data/bruckner/README.md
  - Glossary: glossary.md
  - Code style: STYLE.md
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
