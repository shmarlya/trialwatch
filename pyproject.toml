[project]
name = "trialwatch"
version = "0.1.0"
description = "AI watchdog tracking missing and incomplete clinical-trial results in the EU register"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.8.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "opentelemetry-api>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-logging>=0.66b2",
    "opentelemetry-instrumentation-psycopg>=0.66b2",
    "opentelemetry-sdk>=1.45",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.3.6",
    "pypdf>=7.1.0",
    "python-multipart>=0.0.34",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
trialwatch = "trialwatch.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
docs = [
    "mkdocs-material>=9.8.1",
]

[tool.ruff]
# STYLE.md is the guide; ruff enforces what a tool can see. `uv run ruff check` and
# `uv run ruff format --check` run in CI (.github/workflows/tests.yml) and in pre-commit.
line-length = 120
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
# Bugs and the parts of STYLE.md a linter can check. Left out on purpose: rules that would turn loops into
# comprehensions or any()/all() (PERF401, SIM110), force ternaries (SIM108) or drop named intermediate
# values (RET504); STYLE.md keeps the loop. To add as later refactor phases touch the files that break them
# today: I (import order), UP, A, N.
select = [
    "E4", "E7", "E9", "F",  # pycodestyle errors and pyflakes; E731: no lambda assigned to a name, E741: no l/O/I
    "W",                    # whitespace
    "B",                    # bugbear: likely bugs
    "C4",                   # comprehensions: no needless ones
    "SIM210", "SIM211", "SIM212",  # ternaries that only hide a bool or swap their arms
]
ignore = [
    "B007",  # an unused loop variable keeps its full name (for attempt in range(3)), not `_`
]

[tool.ruff.lint.per-file-ignores]
# FastAPI copies a parameter's default for every request, so a list default in a route is safe
"src/trialwatch/web/*.py" = ["B006"]
"src/trialwatch/*/routes.py" = ["B006"]

[tool.ruff.lint.flake8-bugbear]
# Called in parameter defaults by design: FastAPI and Typer read them as declarations, once
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Form", "fastapi.File", "fastapi.Query", "fastapi.Header", "fastapi.Cookie",
    "fastapi.Body", "fastapi.Path", "typer.Option", "typer.Argument", "trialwatch.web.deps.Requires",
]

[tool.ruff.format]
# Files written before ruff, not reformatted yet. No mass reformat: each file is formatted (and leaves this
# list) in the refactor phase that rewrites it, so code about to move or go isn't reformatted first.
# Every other file, and every new one, must pass `ruff format --check`.
exclude = [
    "75 files would be reformatted, 35 files already formatted",
    "src/trialwatch/auth/actions.py",
    "src/trialwatch/checks/due_date.py",
    "src/trialwatch/checks/evidence.py",
