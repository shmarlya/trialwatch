[project]
name = "trialwatch"
version = "0.1.0"
description = "AI watchdog tracking missing and incomplete clinical-trial results in the EU register"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.8.0",
    "cryptography>=50.0.2",
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "pypdf>=7.1.0",
    "python-multipart>=0.0.34",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
trialwatch = "trialwatch.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
]
docs = [
    "mkdocs-material>=9.8.1",
]
